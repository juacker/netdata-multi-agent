# Minimal config for scaled `agent` replicas.
# Goal: smallest possible RAM/CPU per replica while staying claimed and
# visible in Netdata Cloud. No local history beyond a short ring buffer.

[global]
    update every = 5
    run as user = netdata

[db]
    mode = ram
    retention = 600
    storage tiers = 1

[ml]
    enabled = no

[health]
    enabled = no

[plugins]
    proc = yes
    diskspace = no
    cgroups = no
    tc = no
    idlejitter = no
    timex = no
    apps = no
    perf = no
    slabinfo = no
    ebpf = no
    nfacct = no
    freeipmi = no
    debugfs = no
    profile = no
    statsd = no
    netdata monitoring = no
    go.d = no
    python.d = no
    charts.d = no
    node.d = no

[plugin:proc]
    /proc/stat = yes
    /proc/uptime = yes
    /proc/loadavg = yes
    /proc/meminfo = yes
    /proc/vmstat = yes
    /proc/diskstats = no
    /proc/mdstat = no
    /proc/interrupts = no
    /proc/softirqs = no
    /proc/pressure = no
    /proc/net/dev = no
    /proc/net/sockstat = no
    /proc/net/snmp = no
    /proc/net/netstat = no
    /sys/class/infiniband = no
    /sys/class/drm = no
    /sys/devices/system/edac/mc = no
    /sys/devices/system/node = no
